<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonLoader Event Control Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Modern Gaming Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-gamepad"></i> Event Panel</h2>
            </div>
            <div class="sidebar-nav">
                <h3>Categories</h3>
                <ul id="category-list">
                    <!-- Categories will be injected here dynamically -->
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search events by name or category...">
                </div>
                <button id="add-event-btn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add Event
                </button>
            </header>

            <div class="dashboard">
                <!-- Loading State -->
                <div id="loading-state" class="state-message">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Connecting to Firebase Realtime Database...</p>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="state-message hidden">
                    <i class="fa-solid fa-folder-open"></i>
                    <p>No Events Found</p>
                    <span style="font-size: 0.9rem; color: var(--text-secondary);">Click 'Add Event' to create
                        one.</span>
                </div>

                <!-- Event Cards Grid -->
                <div id="event-grid" class="event-grid hidden">
                    <!-- Event cards will be injected here dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Event Modal -->
    <div id="event-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Event</h2>
                <button class="close-btn" id="close-modal-btn"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="event-form">
                    <input type="hidden" id="event-id">

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="event-category" required placeholder="e.g. Pelayanan">
                    </div>

                    <div class="form-group">
                        <label>Event Name</label>
                        <input type="text" id="event-name" required placeholder="e.g. Buka Pelayanan">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="event-desc" required placeholder="Describe the event..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Delay Between Commands (ms)</label>
                        <input type="number" id="event-delay" required placeholder="2000" min="0">
                    </div>

                    <div class="form-group">
                        <label>Commands List</label>
                        <div id="command-list" class="command-list">
                            <!-- Command inputs injected here -->
                        </div>
                        <button type="button" id="add-cmd-btn" class="btn btn-secondary btn-sm">
                            <i class="fa-solid fa-plus"></i> Add Command
                        </button>
                    </div>

                    <div class="form-group toggle-group">
                        <label>Status (Active/Disabled)</label>
                        <label class="switch">
                            <input type="checkbox" id="event-status" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2><i class="fa-solid fa-triangle-exclamation text-danger"></i> Confirm Delete</h2>
                <button class="close-btn" id="close-delete-modal"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this event? This action cannot be undone.</p>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-delete-btn">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete Event</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App Scripts (Modular) -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
